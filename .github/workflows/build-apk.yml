name: Build Android Split APKs

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: preview-split
        type: choice
        options:
          - preview
          - preview-split
          - production-apk
      version-code:
        description: 'Android versionCode (integer, must be higher than previous)'
        required: false
        type: number

env:
  NDK_VERSION: "27.1.12297006"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install NDK
        run: echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.NDK_VERSION }}" --sdk_root=${ANDROID_HOME}

      - name: Install dependencies
        run: npm ci

      - name: Set versionCode (manual builds only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "${{ inputs.version-code }}" ]; then
            node -e "const fs=require('fs');const a=require('./app.json');a.expo.android.versionCode=${{ inputs.version-code }};fs.writeFileSync('./app.json',JSON.stringify(a,null,2))"
          fi

      - name: Decode keystore (if provided)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          fi

      - name: Create credentials.json (if keystore provided)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo '{
              "android": {
                "keystore": {
                  "keystorePath": "keystore.jks",
                  "keystorePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                  "keyAlias": "${{ secrets.ANDROID_KEY_ALIAS }}",
                  "keyPassword": "${{ secrets.ANDROID_KEY_PASSWORD }}"
                }
              }
            }' > credentials.json
          fi

      - name: Build Android split APKs
        run: eas build --local --platform android --profile ${{ inputs.profile || 'preview-split' }} --non-interactive
        env:
          ORG_GRADLE_PROJECT_org.gradle.jvmargs: "-Xmx6g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
          ORG_GRADLE_PROJECT_org.gradle.workers.max: "1"
          ORG_GRADLE_PROJECT_org.gradle.parallel: "false"

      - name: List artifacts
        run: ls -lh *.apk 2>/dev/null || echo "No APK files at root"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: jellyspot-apks
          path: ./*.apk
          if-no-files-found: error
          compression-level: 0
