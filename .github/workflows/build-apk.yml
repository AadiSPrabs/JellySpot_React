name: Build Android Split APKs

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  NDK_VERSION: "26.1.10909125"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.NDK_VERSION }}" --sdk_root=${ANDROID_HOME}

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: npm ci

      - name: Expo Prebuild (Generate Android Project)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Release APKs (Split by ABI)
        run: |
          cd android
          export JAVA_OPTS="-Xmx2g"
          ./gradlew assembleRelease

      - name: List Built APKs
        run: |
          echo "=== APK outputs ==="
          find android/app/build/outputs -name "*.apk" -type f | sort
          echo ""
          echo "=== File sizes ==="
          find android/app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: jellyspot-split-apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
